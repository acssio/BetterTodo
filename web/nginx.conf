# nginx du conteneur "web" : sert la page, et transmet /api au serveur Go.
# Le navigateur ne parle qu'à une seule adresse : le cookie de session marche sans réglage CORS.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Appels à l'API → conteneur "api" (nom du service dans docker-compose.yml)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers produits par Vite : leur nom contient un hash, ils peuvent être gardés en cache longtemps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tout le reste → index.html (l'application React gère l'affichage)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache"; # index.html toujours revérifié : on reçoit la dernière version
    }
}
